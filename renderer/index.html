<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; media-src blob:; img-src data:">
<title>Dofus fight alerts</title>
<style>
  :root {
    --bg: #14161a; --panel: #1c1f26; --line: #2b3039; --text: #e6e8ec;
    --dim: #949aa6; --ally: #4ea3f7; --enemy: #f2724f; --unknown: #a07ad6;
    --ok: #4cc38a; --bad: #f2724f;
  }
  * { box-sizing: border-box; }
  /* label and section set display, which beats the UA rule for [hidden]. */
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 "Segoe UI", system-ui, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 16px; padding: 10px 16px;
    background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--bad); flex: none; }
  .dot.on { background: var(--ok); }
  .grow { flex: 1; }
  .muted { color: var(--dim); font-size: 12px; }
  nav { display: flex; gap: 4px; padding: 8px 16px 0; }
  nav button {
    background: none; border: none; border-bottom: 2px solid transparent; color: var(--dim);
    padding: 8px 14px; cursor: pointer; font: inherit;
  }
  nav button.on { color: var(--text); border-bottom-color: var(--ally); }
  main { padding: 16px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin: 0 0 10px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-left-width: 3px;
    border-radius: 6px; padding: 10px 12px; margin-bottom: 8px;
  }
  .card.ally { border-left-color: var(--ally); }
  .card.enemy { border-left-color: var(--enemy); }
  .card.unknown { border-left-color: var(--unknown); }
  .name { font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .chip {
    background: #262b34; border: 1px solid var(--line); border-radius: 10px;
    padding: 1px 8px; font-size: 12px; cursor: pointer;
  }
  .chip:hover { border-color: var(--ally); }
  button.primary {
    background: var(--ally); color: #08121d; border: none; border-radius: 5px;
    padding: 7px 14px; font: inherit; font-weight: 600; cursor: pointer;
  }
  button.ghost {
    background: none; color: var(--text); border: 1px solid var(--line);
    border-radius: 5px; padding: 6px 12px; font: inherit; cursor: pointer;
  }
  button.ghost:hover { border-color: var(--ally); }
  button.ghost.on { border-color: var(--ally); color: var(--ally); }
  button.ghost { font-size: 12px; padding: 2px 8px; }
  button.danger { color: var(--bad); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  input, select {
    background: #111317; color: var(--text); border: 1px solid var(--line);
    border-radius: 5px; padding: 6px 8px; font: inherit;
  }
  input:focus, select:focus { outline: none; border-color: var(--ally); }
  label { display: block; }
  label > span { display: block; font-size: 12px; color: var(--dim); margin-bottom: 3px; }
  .form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .form .wide { grid-column: 1 / -1; }
  .row { display: flex; gap: 8px; align-items: center; }
  .results {
    max-height: 190px; overflow: auto; border: 1px solid var(--line);
    border-radius: 5px; margin-top: 4px;
  }
  .results div { padding: 5px 9px; cursor: pointer; }
  .results div:hover { background: #262b34; }
  .results .variant { color: var(--dim); font-size: 12px; }
  .rule .cond button { margin: 0 4px; padding: 0 6px; }
  .rule { display: flex; align-items: center; gap: 12px; }
  .rule .grow { min-width: 0; }
  .rule .sum { font-size: 12px; color: var(--dim); }
  .rule .cond { color: var(--ally); }
  .log div { padding: 4px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .empty { color: var(--dim); padding: 24px 0; text-align: center; }
  .warn { color: #e3b341; }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <span id="status">connexion…</span>
  <span class="grow"></span>
  <span class="muted" id="fightinfo"></span>
  <span class="muted" id="catalog"></span>
</header>

<nav>
  <button data-tab="fight" class="on">Combat</button>
  <button data-tab="rules">Règles</button>
  <button data-tab="log">Journal</button>
</nav>

<main>
  <section id="tab-fight">
    <div class="cols">
      <div><h2>Alliés</h2><div id="allies"></div></div>
      <div><h2>Ennemis</h2><div id="enemies"></div></div>
    </div>
    <div id="unknownwrap" hidden><h2>Indéterminés (invocations)</h2><div id="unknowns"></div></div>
    <p class="muted" id="fightnote"></p>
  </section>

  <section id="tab-rules" hidden>
    <div class="row" style="margin-bottom:12px">
      <button class="primary" id="newrule">Nouvelle règle</button>
      <button class="ghost" id="mergemode" hidden>Fusionner des règles…</button>
      <span class="grow"></span>
      <label class="row" style="gap:6px"><span style="margin:0">Volume</span>
        <input type="range" id="volume" min="0" max="1" step="0.05"></label>
    </div>
    <div id="editor" hidden></div>
    <div id="rulelist"></div>
  </section>

  <section id="tab-log" hidden>
    <h2>Événements</h2>
    <div class="log" id="log"></div>
  </section>
</main>

<script src="../dist/renderer/renderer.js"></script>
</body>
</html>
