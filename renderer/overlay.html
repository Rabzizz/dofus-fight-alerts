<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
<title>alerte</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  #banner {
    margin: 8px; padding: 16px 22px; border-radius: 10px;
    background: rgba(18, 20, 24, .92); border: 1px solid #f2724f;
    box-shadow: 0 8px 28px rgba(0, 0, 0, .55);
    color: #f5f6f8; font: 600 19px/1.3 "Segoe UI", system-ui, sans-serif;
    text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
</style>
</head>
<body>
<div id="banner"></div>
<script>
  // The window is shown and hidden by the main process; this only sets the text.
  window.api.onOverlayShow(({ text }) => {
    document.getElementById("banner").textContent = text;
  });
</script>
</body>
</html>
